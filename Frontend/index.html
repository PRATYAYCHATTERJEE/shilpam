<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Silpam — Handmade with Heritage</title>

    <!-- Bengali + Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= OPENING SCREEN ================= -->

    <section class="intro" id="intro">

        <!-- Decorative Bengal elements -->
        <div class="decor decor-left">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="decor decor-right">
            <span></span>
            <span></span>
            <span></span>
        </div>


        <!-- Small top text -->
        <div class="intro-top">
            <span></span>
            <p>ROOTED IN BENGAL</p>
            <span></span>
        </div>


        <!-- Logo -->
        <div class="logo-wrapper">

            <!-- Replace this with your actual Silpam logo -->
            <img
                src="assets/logo.png"
                alt="Silpam Logo"
                class="silpam-logo"
            >

        </div>


        <!-- Brand -->
        <div class="brand-content">

            <h1>SILPAM</h1>

            <div class="gold-line">
                <span></span>
            </div>

            <p class="tagline">
                HANDMADE WITH HERITAGE
            </p>

            <p class="sub-tagline">
                Made with Heart
            </p>

        </div>


        <!-- Bottom -->
        <div class="intro-bottom">

            <div class="scroll-line"></div>

            <p>ENTER THE WORLD OF SILPAM</p>

            <div class="scroll-line"></div>

        </div>

    </section>


    <!-- ================= MAIN WEBSITE ================= -->

    <main id="main-content">

        <!-- We'll build the navbar here next -->

    </main>


    <script src="js/script.js"></script>

</body>
</html>
