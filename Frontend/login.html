<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Silpam</title>

    <link rel="stylesheet" href="css/login.css">

</head>


<body>

    <!-- Decorative Kolkas -->

    <div class="login-kolka login-kolka-left">
        <img src="assets/kolka.png" alt="">
    </div>

    <div class="login-kolka login-kolka-right">
        <img src="assets/kolka.png" alt="">
    </div>


    <!-- LOGIN PAGE -->

    <main class="login-page">


        <!-- BRAND -->

        <div class="login-brand">

            <div class="brand-ornament">
                ✦
            </div>

            <h1>
                SILPAM
            </h1>

            <p>
                A Piece of Bengal, Made for You.
            </p>

        </div>


        <!-- LOGIN CARD -->

        <section class="login-card">


            <div class="login-heading">

                <span>✦</span>

                <h2>
                    Welcome Back
                </h2>

                <span>✦</span>

            </div>


            <p class="login-subtitle">
                Continue your journey with Silpam
            </p>


            <!-- LOGIN FORM -->

            <form class="login-form">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <div class="password-label">

                        <label for="password">
                            Password
                        </label>

                        <a href="#">
                            Forgot password?
                        </a>

                    </div>


                    <div class="password-input">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <!-- REMEMBER -->

                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                    <span>→</span>
                </button>


            </form>


            <!-- DIVIDER -->

            <div class="login-divider">

                <span></span>

                <p>or</p>

                <span></span>

            </div>


            <!-- REGISTER -->

            <div class="register-text">

                <span>
                    Don't have an account?
                </span>

                <a href="signup.html">
                    Create an account
                </a>

            </div>


        </section>


        <!-- FOOTER -->

        <div class="login-footer">

            <span>❖</span>

            <p>
                Handcrafted with the spirit of Bengal
            </p>

            <span>❖</span>

        </div>


    </main>


    <script src="js/login.js"></script>

</body>

</html>
